# HireLink CI — compile + JUnit + E2E optionnel. AUCUN déploiement.
# Ne nécessite aucun secret de la démo locale (8081 / hirelink / F3C2).
name: hirelink-ci

on:
  push:
    branches: [consolidate/functional-ux-billing, main, master]
  pull_request:
  workflow_dispatch:

jobs:
  backend-junit:
    name: Backend JUnit (MySQL éphémère)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: hirelink_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot"
          --health-interval=8s
          --health-timeout=5s
          --health-retries=20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile
        run: mvn -B -DskipTests package
      - name: JUnit (hirelink_test)
        env:
          HIRELINK_TEST_DB_HOST: 127.0.0.1
          HIRELINK_TEST_DB_PORT: "3306"
          HIRELINK_TEST_DB_USER: root
          HIRELINK_TEST_DB_PASSWORD: ""
        run: mvn -B test
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: backend/target/surefire-reports/
          if-no-files-found: ignore

  e2e-playwright:
    name: Playwright E2E (nécessite services)
    runs-on: ubuntu-latest
    # Désactivé par défaut en PR sans stack ISO : activer via workflow_dispatch input ou secret HL_E2E=1
    if: ${{ github.event_name == 'workflow_dispatch' || vars.HL_E2E == '1' }}
    needs: backend-junit
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: |
          npm install
          npx playwright install --with-deps chromium
      - name: Run E2E
        working-directory: e2e
        env:
          HL_FE: ${{ vars.HL_FE }}
          HL_API: ${{ vars.HL_API }}
          CI: "1"
        run: npm run test:ci
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
          if-no-files-found: ignore

  no-deploy:
    name: Garde-fou no-deploy
    runs-on: ubuntu-latest
    steps:
      - run: echo "Aucun job de déploiement dans ce workflow. Cutover/demo interdits."
