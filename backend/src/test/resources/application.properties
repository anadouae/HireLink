# =============================================================================
# Profil des TESTS D'INTÉGRATION — à lire avant toute exécution.
#
# Cette configuration ne pointe QUE sur la base de test « hirelink_test », créée
# automatiquement si elle manque (createDatabaseIfNotExist). Elle ne lit aucun
# application-local.properties : aucun secret SMTP, aucune clé IA, aucune clé JWT
# réelle n'entre dans un test. Un contrôle applicatif (HireLinkIntegrationTestSupport)
# refuse de démarrer si l'URL change de nom de base.
#
# Exécution : mvn test   (MariaDB/MySQL local accessible, comme pour l'application)
# =============================================================================
spring.application.name=hirelink

spring.datasource.url=jdbc:mysql://${HIRELINK_TEST_DB_HOST:127.0.0.1}:${HIRELINK_TEST_DB_PORT:3306}/hirelink_test?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=8000
spring.datasource.username=${HIRELINK_TEST_DB_USER:root}
spring.datasource.password=${HIRELINK_TEST_DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schéma reconstruit à chaque campagne de tests : aucune donnée de démonstration n'est mélangée aux fixtures.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Port HTTP aléatoire : jamais de collision avec le backend de démonstration sur 8081.
server.port=0

spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
server.error.include-message=always
server.error.include-stacktrace=never
server.error.whitelabel.enabled=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

hirelink.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
hirelink.frontend.base-url=http://localhost:5500

# Clé JWT de TEST uniquement (32+ caractères, publique, sans valeur) — remplace le fichier data/jwt.key.
hirelink.jwt.secret=hirelink-integration-test-key-not-for-any-real-use-0000000000
hirelink.jwt.access-ttl-minutes=15
hirelink.session.idle-minutes=120
hirelink.session.absolute-hours=168
hirelink.cookie.secure=false
# BCrypt à 4 : les tests créent des dizaines de comptes, la force 12 de production serait un coût inutile.
hirelink.security.bcrypt-strength=4
hirelink.security.admin-mfa-required=false
# Limite de débit relevée : les tests de concurrence doivent mesier le métier, pas le garde-fou.
hirelink.ratelimit.per-ip-per-minute=100000
hirelink.swagger.enabled=false
hirelink.webauthn.rp-id=localhost
hirelink.webauthn.origins=http://localhost:5500
hirelink.google.client-id=
hirelink.google.dev-bypass=true

hirelink.otp.length=6
hirelink.otp.ttl-minutes=15
hirelink.otp.log-to-console=false

# Aucun SMTP : les e-mails sont journalisés en base avec le statut LOGGED, jamais envoyés.
spring.mail.host=

# Aucune clé IA : HttpLlmProvider retombe sur LocalLlmProvider (résultat explicitement marqué « local »).
hirelink.llm.provider=
hirelink.llm.fallback-chain=
hirelink.llm.api-key=
hirelink.llm.gemini.api-key=
hirelink.llm.groq.api-key=
hirelink.llm.mistral.api-key=

# Aucune donnée de démonstration dans la base de test : les fixtures viennent des tests eux-mêmes.
hirelink.seed.enabled=false
hirelink.seed.force-reset=false
hirelink.bootstrap.admin-email=
hirelink.bootstrap.admin-password=

# Tâches planifiées coupées : un test déclenche le job lui-même, sans course avec l'horloge.
hirelink.scheduling.enabled=false

logging.level.ma.ensat.hirelink=WARN
