# Ce profil exige une URL explicite et une confirmation au lancement.
spring.datasource.url=${HIRELINK_REALDB_URL:}
spring.datasource.username=${HIRELINK_REALDB_USERNAME:root}
spring.datasource.password=${HIRELINK_REALDB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate

hirelink.realdb.confirmation=${HIRELINK_REALDB_CONFIRMATION:}
hirelink.seed.enabled=false
hirelink.seed.force-reset=false
hirelink.startup-migrations.enabled=false
hirelink.external-jobs.sync-enabled=false
hirelink.external-jobs.startup-sync=false
hirelink.external-jobs.ats.scheduled-sync=false
hirelink.external-jobs.maroc.enabled=false
hirelink.external-jobs.remoteok.enabled=false
hirelink.external-jobs.greenhouse.enabled=false
hirelink.external-jobs.lever.enabled=false
hirelink.external-jobs.ashby.enabled=false
