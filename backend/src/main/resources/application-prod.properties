# =============================================================================
# Profil PRODUCTION  →  --spring.profiles.active=prod
# Toutes les valeurs sensibles viennent de variables d'environnement.
# =============================================================================
spring.datasource.url=${HIRELINK_DB_URL}
spring.datasource.username=${HIRELINK_DB_USER}
spring.datasource.password=${HIRELINK_DB_PASSWORD}

# Secret JWT obligatoire (32 caractères minimum), jamais généré automatiquement
hirelink.jwt.secret=${HIRELINK_JWT_SECRET}

# HTTPS : cookie Secure, HSTS (via le proxy qui termine TLS), en-têtes X-Forwarded-* pris en compte
hirelink.cookie.secure=true
server.forward-headers-strategy=framework
hirelink.cors.allowed-origins=${HIRELINK_CORS_ORIGINS}
hirelink.frontend.base-url=${HIRELINK_FRONTEND_URL}
hirelink.webauthn.rp-id=${HIRELINK_WEBAUTHN_RP_ID}
hirelink.webauthn.origins=${HIRELINK_WEBAUTHN_ORIGINS}

# Aucune donnée de démonstration, aucun secret dans les logs, pas de Swagger public
hirelink.seed.enabled=false
hirelink.seed.force-reset=false
hirelink.otp.log-to-console=false
hirelink.google.dev-bypass=false
hirelink.swagger.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# E-mails réels obligatoires (codes, réinitialisation, alertes)
hirelink.mail.enabled=true
spring.mail.host=${HIRELINK_SMTP_HOST}
spring.mail.port=${HIRELINK_SMTP_PORT:587}
spring.mail.username=${HIRELINK_SMTP_USER:}
spring.mail.password=${HIRELINK_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

logging.level.ma.ensat.hirelink=INFO
