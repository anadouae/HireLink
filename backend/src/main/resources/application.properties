# =============================================================================
# HireLink V1 — MySQL + JWT + auth frictionless / Google
# Accès BDD : phpMyAdmin / Workbench → localhost:3306 → root / (mot de passe vide)
#              Schema : hirelink (MariaDB XAMPP 10.4)
# =============================================================================

spring.application.name=hirelink

spring.datasource.url=jdbc:mysql://localhost:3306/hirelink?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Dialect auto-détecté (MariaDB 10.4 / XAMPP sur :3306)

server.port=8081
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

hirelink.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,null,http://localhost:8081

# JWT (changer en prod)
hirelink.jwt.secret=HireLinkDevSecretKey_ChangeMe_ENSA_Tetouan_2026_SecureEnough32b!
hirelink.jwt.expiration-ms=86400000

# Google Sign-In — Client ID OAuth (Google Cloud Console)
# Pas de Client Secret requis : vérif ID token côté serveur uniquement
hirelink.google.client-id=429951680837-5mt85o8am7b095fq6f3b2do26bpp36ff.apps.googleusercontent.com
hirelink.google.dev-bypass=false

# OTP : toujours loggé en console ; email optionnel
hirelink.otp.length=6
hirelink.otp.ttl-minutes=15
hirelink.otp.log-to-console=true

# Mail (optionnel — laisser désactivé pour démo locale)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
hirelink.mail.enabled=false
hirelink.mail.from=noreply@hirelink.local

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

# Uploads OCR (CV PDF / TXT)
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=12MB

logging.level.ma.ensat.hirelink=INFO

# true une fois pour recharger le jeu de données opérationnel (remettre à false ensuite)
hirelink.seed.force-reset=false

# F15 — LLM (optionnel). Sans clé → LocalLlmProvider (fallback déterministe).
# Ex. Gemini : hirelink.llm.provider=gemini + clé Google AI Studio
# Ex. Mistral : hirelink.llm.provider=mistral + clé console.mistral.ai
hirelink.llm.api-key=
hirelink.llm.provider=gemini
hirelink.llm.model=gemini-1.5-flash
