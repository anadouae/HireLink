# =============================================================================
# HireLink V1 — MySQL + JWT + auth frictionless / Google
# Accès BDD : phpMyAdmin / Workbench → localhost:3306 → root / (mot de passe vide)
#              Schema : hirelink (MariaDB XAMPP 10.4)
# =============================================================================

spring.application.name=hirelink

# Charge les clés IA locales si le fichier existe (gitignored)
# Secrets locaux (ignorés par Git) : à côté du JAR / dans backend/, ou dans src/main/resources
spring.config.import=optional:file:./application-local.properties,optional:file:./backend/application-local.properties,optional:classpath:application-local.properties

spring.datasource.url=jdbc:mysql://127.0.0.1:3306/hirelink?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&connectTimeout=8000
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Dialect auto-détecté (MariaDB 10.4 / XAMPP sur :3306)

server.port=8081
spring.servlet.multipart.max-file-size=8MB
spring.servlet.multipart.max-request-size=8MB
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never
server.error.include-exception=false
server.error.whitelabel.enabled=false
server.tomcat.max-http-form-post-size=1MB
server.max-http-request-header-size=16KB
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# 5500 = Live Server / python http.server ; 63342 = aperçu IntelliJ (Open in Browser)
hirelink.cors.allowed-origins=${HIRELINK_CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:63342,http://127.0.0.1:63342}

# --- Sécurité : jetons, sessions, cookies -------------------------------------------------------------
# Secret JWT : variable d'environnement HIRELINK_JWT_SECRET (32 caractères minimum). Si elle est absente, un secret
# aléatoire est généré au premier démarrage dans backend/data/jwt.key (ignoré par Git). Rien n'est écrit dans le dépôt.
hirelink.jwt.secret=${HIRELINK_JWT_SECRET:}
hirelink.jwt.access-ttl-minutes=15
# Session : refus du rafraîchissement après 2 h d'inactivité ; durée de vie maximale 7 jours
hirelink.session.idle-minutes=120
hirelink.session.absolute-hours=168
# Cookie du jeton de rafraîchissement : Secure forcé en production (HTTPS)
hirelink.cookie.secure=false
hirelink.security.bcrypt-strength=12
hirelink.ratelimit.per-ip-per-minute=600
hirelink.swagger.enabled=${HIRELINK_SWAGGER_ENABLED:false}
# Passkeys (WebAuthn) : RP ID = nom de domaine ; « localhost » suffit en développement (sans HTTPS)
hirelink.webauthn.rp-id=${HIRELINK_WEBAUTHN_RP_ID:localhost}
hirelink.webauthn.origins=${HIRELINK_WEBAUTHN_ORIGINS:http://localhost:5500,http://localhost:63342}
# URL publique du frontend (liens de réinitialisation du mot de passe)
hirelink.frontend.base-url=${HIRELINK_FRONTEND_URL:http://localhost:5500}

# Google Sign-In — Client ID OAuth (Google Cloud Console)
# Pas de Client Secret requis : vérif ID token côté serveur uniquement
hirelink.google.client-id=${HIRELINK_GOOGLE_CLIENT_ID:429951680837-5mt85o8am7b095fq6f3b2do26bpp36ff.apps.googleusercontent.com}
hirelink.google.dev-bypass=false

# OTP : toujours loggé en console ; email optionnel
hirelink.otp.length=6
hirelink.otp.ttl-minutes=15
# DÉVELOPPEMENT UNIQUEMENT : affiche codes et liens secrets dans la console. Doit être false en production (profil prod).
hirelink.otp.log-to-console=true

# Mail (optionnel — laisser désactivé pour démo locale)
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.smtp.auth=false
hirelink.mail.enabled=false
hirelink.mail.from=noreply@hirelink.local

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html


logging.level.ma.ensat.hirelink=INFO

# true une fois pour recharger le jeu de données opérationnel (remettre à false ensuite)
hirelink.seed.force-reset=false
# Comptes et données de démonstration (désactivés par le profil prod)
hirelink.seed.enabled=true
# Création du premier administrateur en production (si aucun admin n'existe) : variables d'environnement
hirelink.bootstrap.admin-email=${HIRELINK_ADMIN_EMAIL:}
hirelink.bootstrap.admin-password=${HIRELINK_ADMIN_PASSWORD:}

# F15 — LLM multi-provider (Gemini / Groq / Mistral). Sans clé → fallback local.
# Clés : variables d'environnement HIRELINK_GEMINI_API_KEY / HIRELINK_GROQ_API_KEY / HIRELINK_MISTRAL_API_KEY,
# ou fichier application-local.properties (ignoré par Git). Sans clé : suggestions locales (l'application fonctionne).
hirelink.llm.provider=groq
hirelink.llm.fallback-chain=groq,gemini,mistral
hirelink.llm.api-key=${HIRELINK_LLM_API_KEY:}
hirelink.llm.gemini.api-key=${HIRELINK_GEMINI_API_KEY:}
hirelink.llm.gemini.model=gemini-3.5-flash-lite
hirelink.llm.groq.api-key=${HIRELINK_GROQ_API_KEY:}
hirelink.llm.groq.model=qwen/qwen3.8-27b
hirelink.llm.mistral.api-key=${HIRELINK_MISTRAL_API_KEY:}
hirelink.llm.mistral.model=mistral-small-latest

# SLA monitor (ms) — défaut 30 min
hirelink.sla.poll-ms=1800000
