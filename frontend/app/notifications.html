<body class="rc" data-role="ANY">
  <div class="rc-app">
    <aside class="rc-sidebar" id="rc-sidebar" aria-label="Menu principal"></aside>
    <div class="rc-main">
      <header class="rc-topbar" id="rc-topbar"></header>
      <main class="rc-content" id="rc-content">
        <div class="rc-head">
          <div>
            <p class="rc-eyebrow">Organisation</p>
            <h1>Notifications</h1>
            <p>Candidatures, changements d’étape, assignations et rappels de délai.</p>
          </div>
          <div class="rc-head-actions"><button type="button" class="btn btn-secondary" id="btn-readall">Tout marquer comme lu</button></div>
        </div>
        <div class="rc-toolbar" style="flex-wrap:wrap;gap:.55rem;align-items:center">
          <div class="rc-chips" id="n-chips" role="tablist">
            <button type="button" class="rc-chip is-on" data-v="all">Toutes</button>
            <button type="button" class="rc-chip" data-v="unread">Non lues</button>
          </div>
          <select id="n-f-kind" class="rc-select" aria-label="Type de notification">
            <option value="all">Tous les types</option>
            <option value="APPLICATION">Nouvelle candidature</option>
            <option value="FOLLOW">Offre d’une entreprise suivie</option>
            <option value="STATUS">Candidature / statut</option>
            <option value="INTERVIEW">Entretien</option>
            <option value="SLA">Délai</option>
            <option value="ASSIGN">Assignation</option>
            <option value="DECISION">Décision</option>
            <option value="PIPELINE">Pipeline</option>
            <option value="HIRED">Embauche</option>
            <option value="SYSTEM">Équipe</option>
            <option value="MODERATION">Modération</option>
          </select>
          <select id="n-f-when" class="rc-select" aria-label="Période">
            <option value="all">Toutes les dates</option>
            <option value="today">Aujourd’hui</option>
            <option value="7d">7 derniers jours</option>
            <option value="30d">30 derniers jours</option>
          </select>
        </div>
        <section class="rc-card is-flush"><div class="rc-list" id="n-list"></div></section>
      </main>
    </div>
  </div>
  <div class="rc-scrim" id="rc-scrim"></div>
  <script defer src="../js/mascotte.js?v=20261105i"></script>

  <script defer src="../js/app-shell.js?v=20261107d"></script>
  <script defer src="../js/notifications.js?v=20261107c"></script>
</body>
</html>
