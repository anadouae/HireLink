<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin — HireLink</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="../css/app.css" />
  <script src="../js/theme.js"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="../index.html">
        <span class="brand-mark"></span>
        <span class="brand-name">Hire<span style="color:#d9ba6a">Link</span></span>
      </a>
      <nav class="side-nav">
        <a class="side-link is-active" href="admin.html">Supervision</a>
        <a class="side-link" href="../index.html">Landing</a>
      </nav>
      <div class="side-footer">
        <div id="side-user">—</div>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-logout" style="margin-top:.75rem;color:#fff;border-color:rgba(255,255,255,.2)">Déconnexion</button>
      </div>
    </aside>
    <div class="app-main">
      <header class="topbar">
        <div><strong>Administration</strong></div>
        <div class="avatar" id="avatar">A</div>
      </header>
      <main class="content">
        <div class="page-title">
          <div>
            <p class="eyebrow">Admin</p>
            <h1>Indicateurs &amp; comptes</h1>
          </div>
        </div>
        <div class="stat-grid" id="stats"></div>
        <section class="panel">
          <div class="panel-head"><h2>Utilisateurs</h2></div>
          <div class="panel-body" style="padding:0 1.1rem .5rem">
            <table class="table">
              <thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Actif</th><th></th></tr></thead>
              <tbody id="users-body"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/config.js"></script>
  <script src="../js/ui.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/growth.js"></script>
  <script src="../js/admin.js"></script>
</body>
</html>
