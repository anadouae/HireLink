<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pipeline — HireLink</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/design-system.css" />
  <link rel="stylesheet" href="../css/app.css" />
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="row between">
        <a class="brand" href="recruiter.html"><span class="brand-mark"></span><span class="brand-name">Hire<span style="color:#e2c98a">Link</span></span></a>
        <button type="button" class="mobile-toggle" id="close-side">✕</button>
      </div>
      <nav class="side-nav">
        <a class="side-link" href="recruiter.html">Vue d’ensemble</a>
        <a class="side-link is-active" href="recruiter-pipeline.html">Pipeline</a>
        <a class="side-link" href="recruiter-offers.html">Mes offres</a>
        <a class="side-link" href="recruiter-team.html">Équipe &amp; Cabinet</a>
        <a class="side-link js-in-app-help" href="../help.html">Aide</a>
      </nav>
      <div class="side-footer">
        <div id="side-user">—</div>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-logout" style="margin-top:0.75rem;color:#fff;border-color:rgba(255,255,255,.2)">Déconnexion</button>
      </div>
    </aside>
    <div class="app-main">
      <header class="topbar">
        <button type="button" class="btn btn-ghost btn-sm" id="open-side" style="display:none">Menu</button>
        <div class="topbar-search"><span aria-hidden="true">⌕</span><input type="search" id="search-pipeline" placeholder="Candidat, offre, statut…" autocomplete="off" /></div>
        <div class="topbar-actions">
          <button type="button" class="btn btn-ghost btn-sm" id="btn-refresh">Actualiser</button>
          <div class="avatar" id="avatar">R</div>
        </div>
      </header>
      <main class="content">
        <div class="page-title">
          <div>
            <p class="eyebrow">ATS · Funnel · SLA · IA bornée</p>
            <h1>Pipeline</h1>
            <p class="muted">Kanban sécurisé (R01–R05) · matching non décisionnel · alertes SLA.</p>
          </div>
          <select id="pipe-filter" class="btn btn-soft" style="appearance:auto;padding:0.55rem 0.85rem">
            <option value="all">Tous</option>
            <option value="urgent">SLA ≤ 2 j</option>
            <option value="breached">SLA dépassé</option>
            <option value="hot">Score ≥ 75%</option>
            <option value="interview">Entretiens planifiés</option>
          </select>
        </div>
        <div id="funnel-strip" class="panel" style="margin-bottom:1rem;padding:0.85rem 1.1rem">
          <div class="muted" style="font-size:0.8rem">Chargement funnel…</div>
        </div>
        <section class="panel">
          <div class="panel-body"><div class="kanban" id="kanban"></div></div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/ui.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/in-app-help.js"></script>
  <script src="../js/product.js"></script>
  <script src="../js/shell.js"></script>
  <script src="../js/growth.js"></script>
  <script src="../js/recruiter-pipeline.js"></script>
</body>
</html>
