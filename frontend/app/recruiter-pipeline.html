<body class="rc" data-role="RECRUTEUR">
  <div class="rc-app">
    <aside class="rc-sidebar" id="rc-sidebar" aria-label="Menu principal"></aside>
    <div class="rc-main">
      <header class="rc-topbar" id="rc-topbar"></header>
      <main class="rc-content" id="rc-content">
        <div class="rc-head">
          <div>
            <p class="rc-eyebrow">Recrutement</p>
            <h1>Candidatures</h1>
            <p>Suivez chaque dossier jusqu’à l’entretien · délai de 1ʳᵉ réponse · refus motivé.</p>
          </div>
          <div class="rc-head-actions"><button type="button" class="btn btn-ghost" id="btn-refresh">Actualiser</button></div>
        </div>
        <div class="rc-toolbar" role="toolbar" aria-label="Filtres des candidatures">
          <div class="rc-seg" role="tablist" aria-label="Mode d’affichage" id="pipe-view-seg">
            <button type="button" class="rc-seg-btn is-on" data-view="kanban" aria-selected="true">Kanban</button>
            <button type="button" class="rc-seg-btn" data-view="list" aria-selected="false">Liste</button>
          </div>
          <select id="pipe-offer" class="rc-select" aria-label="Filtrer par offre"><option value="all">Toutes les offres</option></select>
          <select id="pipe-filter" hidden><option value="all">Tous</option><option value="urgent">urgent</option><option value="breached">breached</option><option value="hot">hot</option><option value="interview">interview</option></select>
          <div class="rc-chips" id="pipe-chips" role="tablist" aria-label="Lecture des candidatures">
            <button type="button" class="rc-chip is-on" data-pipe="all">Tous</button>
            <button type="button" class="rc-chip" data-pipe="urgent">Réponse ≤ 2 j</button>
            <button type="button" class="rc-chip" data-pipe="breached">Délai dépassé</button>
            <button type="button" class="rc-chip" data-pipe="hot">Match ≥ 75 %</button>
            <button type="button" class="rc-chip" data-pipe="interview">Entretiens</button>
          </div>
          <div class="rc-chips is-hidden" id="list-chips" role="tablist" aria-label="Statuts en liste">
            <button type="button" class="rc-chip is-on" data-v="active">En cours</button>
            <button type="button" class="rc-chip" data-v="interview">Entretiens</button>
            <button type="button" class="rc-chip" data-v="hired">Embauchés</button>
            <button type="button" class="rc-chip" data-v="rejected">Refusés</button>
            <button type="button" class="rc-chip" data-v="withdrawn">Retirés</button>
            <button type="button" class="rc-chip" data-v="all">Tous</button>
          </div>
          <select id="list-sort" class="rc-select is-hidden" aria-label="Trier la liste"><option value="recent">Plus récents</option><option value="match">Meilleur match</option><option value="sla">Échéance de réponse</option><option value="name">Nom (A–Z)</option></select>
          <span class="rc-spacer"></span><span class="rc-pill" id="kanban-total">—</span>
        </div>
        <section class="rc-card" id="funnel-strip"><span class="rc-skel" style="height:62px;margin:.9rem 1.2rem"></span></section>
        <div class="rc-kanban" id="kanban"><span class="rc-skel" style="height:240px;grid-column:1/-1"></span></div>
        <section class="rc-card is-flush is-hidden" id="pipe-list-panel">
          <div class="rc-tablewrap"><table class="rc-table">
            <thead><tr><th>Candidat</th><th>Offre</th><th>Étape</th><th>Match</th><th>Réponse</th><th>Reçue le</th><th></th></tr></thead>
            <tbody id="pipe-list-body"></tbody>
          </table></div>
        </section>
      </main>
    </div>
  </div>
  <div class="rc-scrim" id="rc-scrim"></div>
  <script defer src="../js/mascotte.js?v=20261105i"></script>
  <script defer src="../js/premium.js?v=20261106g"></script>

  <script defer src="../js/places.js?v=20261103h"></script>

  <script defer src="../js/interview.js?v=20261110e"></script>
  <script defer src="../js/in-app-help.js?v=20261105s"></script>
  <script defer src="../js/credits.js?v=20261105v"></script>
  <script defer src="../js/app-shell.js?v=20261110b"></script>
  <script defer src="../js/match.js?v=20261110e"></script>
  <script defer src="../js/recruiter-pipeline.js?v=20261110d"></script>
</body>
</html>
