<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:8081 http://127.0.0.1:8081; connect-src 'self' http://localhost:8081 http://127.0.0.1:8081 https://accounts.google.com; frame-src https://accounts.google.com blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mes candidatures — HireLink</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" type="image/png" href="../assets/logo-hirelink-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css?v=20261029a" />
  <link rel="stylesheet" href="../css/design-system.css?v=20261029a" />
  <link rel="stylesheet" href="../css/app.css?v=20261029a" />
  <link rel="stylesheet" href="../css/components.css?v=20261029a" />
  <link rel="stylesheet" href="../css/shell.css?v=20261029a" />
  <script data-role="CANDIDAT" src="../js/app-guard.js?v=20261029a"></script>
  <script src="../js/theme.js?v=20261029a"></script>
</head>
<body class="rc" data-role="CANDIDAT" data-active="applications">
  <div class="rc-app">
    <aside class="rc-sidebar" id="rc-sidebar" aria-label="Menu principal"></aside>
    <div class="rc-main">
      <header class="rc-topbar" id="rc-topbar"></header>
      <main class="rc-content" id="rc-content">
        <div class="rc-head">
          <div>
            <p class="rc-eyebrow">Espace candidat</p>
            <h1>Mes candidatures</h1>
            <p class="rc-muted" id="apps-summary">Chargement…</p>
          </div>
          <div class="rc-head-actions"><a class="btn btn-primary" href="candidate.html">Trouver une offre</a></div>
        </div>
        <div class="filter-board">
          <div class="cand-filters" id="app-status-filter" role="tablist" aria-label="Filtrer par statut">
            <button type="button" class="is-on" data-st="all">Toutes</button>
            <button type="button" data-st="active">En cours</button>
            <button type="button" data-st="INTERVIEW">Entretien</button>
            <button type="button" data-st="REJECTED">Refusées</button>
            <button type="button" data-st="WITHDRAWN">Retirées</button>
          </div>
        </div>

        <div class="split-board">
        <section class="split-list" id="view-list">
          <div id="apps-list">
            <p class="muted">Chargement…</p>
          </div>
        </section>

        <section id="view-detail" class="split-detail cand-detail" hidden>
          <div class="cand-detail-head">
            <div>
              <h2 id="d-title">—</h2>
              <p class="muted" id="d-sub" style="margin:0.25rem 0 0">—</p>
            </div>
            <span class="badge badge-info" id="d-status">—</span>
          </div>
          <div id="d-interview" hidden></div>
          <h3 class="timeline-title">Avancement du dossier</h3>
          <div class="hl-timeline hl-timeline--airy" id="d-timeline"></div>
          <div style="margin:1rem 0 .3rem">
            <div style="display:flex;justify-content:space-between;font-size:0.8rem;margin-bottom:0.3rem">
              <span class="muted">Compatibilité profil × offre</span>
              <strong id="d-match-pct">—</strong>
            </div>
            <div class="match-bar"><span id="d-match-bar" style="width:0%"></span></div>
          </div>
          <div class="cand-detail-actions">
            <button type="button" class="btn btn-secondary btn-sm" id="d-ai-prep">Synthèse de mon CV</button>
            <span id="d-actions" style="display:contents"></span>
          </div>
          <div id="d-prep" hidden style="margin-top:0.8rem"></div>
        </section>
        </div>
      
      </main>
    </div>
  </div>
  <div class="rc-scrim" id="rc-scrim"></div>
  <script defer src="../js/ui.js?v=20261029a"></script>
  <script defer src="../js/api.js?v=20261029a"></script>
  <script defer src="../js/in-app-help.js?v=20261029a"></script>
  <script defer src="../js/app-shell.js?v=20261029a"></script>
  <script defer src="../js/growth.js?v=20261029a"></script>
  <script defer src="../js/candidate-applications.js?v=20261029a"></script>
</body>
</html>
