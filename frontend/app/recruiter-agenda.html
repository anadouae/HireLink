<body class="rc" data-role="RECRUTEUR">
  <div class="rc-app">
    <aside class="rc-sidebar" id="rc-sidebar" aria-label="Menu principal"></aside>
    <div class="rc-main">
      <header class="rc-topbar" id="rc-topbar"></header>
      <main class="rc-content" id="rc-content">
        <div class="rc-head">
          <div>
            <p class="rc-eyebrow">Recrutement</p>
            <h1>Agenda</h1>
            <p>Vue calendrier des rendez-vous — filtrez par période, mode, type ou offre.</p>
          </div>
          <div class="rc-head-actions">
            <a class="btn btn-ghost" href="recruiter-interviews.html">Gérer les entretiens</a>
            <a class="btn btn-secondary" href="recruiter-pipeline.html">Planifier depuis le pipeline</a>
          </div>
        </div>
        <div class="rc-toolbar" id="ag-filters" style="flex-wrap:wrap;gap:.55rem;align-items:center">
          <select id="ag-f-when" class="rc-select" aria-label="Période">
            <option value="today">Aujourd’hui</option>
            <option value="week" selected>7 prochains jours</option>
            <option value="month">30 jours</option>
            <option value="all">Toutes les dates à venir</option>
          </select>
          <select id="ag-f-type" class="rc-select" aria-label="Mode">
            <option value="all">Tous les modes</option>
            <option value="VISIO">Visioconférence</option>
            <option value="ONSITE">Sur site</option>
            <option value="PHONE">Téléphone</option>
          </select>
          <select id="ag-f-kind" class="rc-select" aria-label="Type">
            <option value="all">Tous les types</option>
            <option value="HR">Entretien RH</option>
            <option value="TECHNICAL">Technique</option>
            <option value="MANAGER">Manager</option>
            <option value="FINAL">Final</option>
          </select>
          <select id="ag-f-offer" class="rc-select" aria-label="Offre"><option value="all">Toutes les offres</option></select>
          <button type="button" class="btn btn-ghost btn-sm" id="ag-f-reset">Réinitialiser</button>
        </div>
        <section class="rc-card is-flush"><div id="ag-list" class="ag-days"></div></section>
      </main>
    </div>
  </div>
  <div class="rc-scrim" id="rc-scrim"></div>
