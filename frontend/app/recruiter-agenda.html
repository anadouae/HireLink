<body class="rc" data-role="RECRUTEUR">
  <div class="rc-app">
    <aside class="rc-sidebar" id="rc-sidebar" aria-label="Menu principal"></aside>
    <div class="rc-main">
      <header class="rc-topbar" id="rc-topbar"></header>
      <main class="rc-content" id="rc-content">
        <div class="rc-head">
          <div>
            <p class="rc-eyebrow">Recrutement</p>
            <h1>Agenda</h1>
            <p>Tous les entretiens de l’équipe dans un calendrier : mois, semaine, jour ou liste.</p>
          </div>
          <div class="rc-head-actions">
            <a class="btn btn-ghost" href="recruiter-interviews.html">Gérer les entretiens</a>
            <a class="btn btn-secondary" href="recruiter-pipeline.html">Planifier depuis le pipeline</a>
          </div>
        </div>
        <div class="ag-stats" id="ag-stats" aria-live="polite"></div>
        <section class="rc-card is-flush ag-shell">
          <div class="ag-bar">
            <div class="ag-bar-left">
              <div class="ag-nav" id="ag-nav">
                <button type="button" class="ag-icon" id="ag-prev" aria-label="Période précédente" title="Précédent (←)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M15 6l-6 6 6 6"/></svg></button>
                <button type="button" class="btn btn-ghost btn-sm" id="ag-today" title="Aujourd’hui (T)">Aujourd’hui</button>
                <button type="button" class="ag-icon" id="ag-next" aria-label="Période suivante" title="Suivant (→)"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 6l6 6-6 6"/></svg></button>
              </div>
              <h2 class="ag-title" id="ag-title" aria-live="polite">Agenda</h2>
            </div>
            <div class="ag-views" id="ag-views" role="group" aria-label="Vue du calendrier">
              <button type="button" data-view="month" title="Mois (M)">Mois</button>
              <button type="button" data-view="week" title="Semaine (S)">Semaine</button>
              <button type="button" data-view="day" title="Jour (D)">Jour</button>
              <button type="button" data-view="list" title="Liste (L)">Liste</button>
            </div>
          </div>
          <div class="ag-filters" id="ag-filters">
            <select id="ag-f-type" class="rc-select" aria-label="Mode">
              <option value="all">Tous les modes</option>
              <option value="VISIO">Visioconférence</option>
              <option value="ONSITE">Sur site</option>
            </select>
            <select id="ag-f-kind" class="rc-select" aria-label="Type d’entretien">
              <option value="all">Tous les types</option>
              <option value="HR">Entretien RH</option>
              <option value="TECHNICAL">Technique</option>
              <option value="MANAGER">Manager</option>
              <option value="CASE">Étude de cas</option>
              <option value="TEAM">Rencontre d’équipe</option>
              <option value="FINAL">Final</option>
            </select>
            <select id="ag-f-offer" class="rc-select" aria-label="Offre"><option value="all">Toutes les offres</option></select>
            <label class="ag-check"><input type="checkbox" id="ag-f-cancelled" /> Afficher les annulés</label>
            <button type="button" class="btn btn-ghost btn-sm" id="ag-f-reset">Réinitialiser</button>
            <div class="ag-legend" aria-label="Légende">
              <span><i class="t-visio"></i>Visio</span><span><i class="t-onsite"></i>Sur site</span>
            </div>
          </div>
          <div id="ag-cal" class="ag-cal"></div>
        </section>
      </main>
    </div>
  </div>
  <div class="rc-scrim" id="rc-scrim"></div>
  <div class="ag-sheet-scrim" id="ag-sheet-scrim" hidden></div>
  <aside class="ag-sheet" id="ag-sheet" role="dialog" aria-modal="false" aria-labelledby="ag-sheet-title" hidden>
    <header class="ag-sheet-head">
      <div><h2 id="ag-sheet-title">Entretien</h2><p id="ag-sheet-sub"></p></div>
      <button type="button" class="drawer-close" id="ag-sheet-close" aria-label="Fermer">✕</button>
    </header>
    <div class="ag-sheet-body" id="ag-sheet-body"></div>
  </aside>
  <script defer src="../js/mascotte.js?v=20261101r"></script>

  <script defer src="../js/search.js?v=20261101r"></script>
  <script defer src="../js/places.js?v=20261101r"></script>

  <script defer src="../js/interview.js?v=20261101r"></script>
  <script defer src="../js/in-app-help.js?v=20261102q"></script>
  <script defer src="../js/app-shell.js?v=20261102q"></script>
  <script defer src="../js/recruiter-agenda.js?v=20261101r"></script>
</body>
</html>
