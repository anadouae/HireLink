<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="robots" content="noindex" />
  <title>Redirection — Candidatures</title>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var legacy = params.get("view");
      params.set("view", "list");
      if (legacy && ["active", "interview", "hired", "rejected", "withdrawn", "all"].indexOf(legacy) >= 0) {
        params.set("status", legacy);
      }
      location.replace("recruiter-pipeline.html?" + params.toString());
    })();
  </script>
</head>
<body>
  <p>La rubrique Candidats est fusionnée dans <a href="recruiter-pipeline.html?view=list">Candidatures · Liste</a>.</p>
</body>
</html>
