<body class="rc" data-role="CANDIDAT" data-active="offers">
  <div class="rc-app">
    <aside class="rc-sidebar" id="rc-sidebar" aria-label="Menu principal"></aside>
    <div class="rc-main">
      <header class="rc-topbar" id="rc-topbar"></header>
      <main class="rc-content" id="rc-content">
        <div class="rc-head">
          <div>
            <p class="rc-eyebrow">Espace candidat</p>
            <h1>Offres</h1>
            <p class="rc-muted" id="offers-lead">La compatibilité croise vos compétences, langues, expérience, contrat et lieu avec l’offre. Elle sert à trier, jamais à décider.</p>
          </div>
        </div>

        <div class="filter-board">
          <div class="filter-board-head">
            <label class="match-toggle">
              <span class="switch"><input type="checkbox" id="match-only" role="switch" /><span class="slider"></span></span>
              <span class="match-toggle-text"><strong>Offres qui correspondent à mon profil</strong><small id="match-hint"></small></span>
            </label>
            <span class="muted" id="filter-summary"></span>
            <button type="button" class="btn btn-ghost btn-sm" id="btn-clear-filters">Effacer les filtres</button>
          </div>
          <div class="offer-advanced" id="offer-advanced">
            <label>Ville
              <select id="f-city"><option value="">Toutes</option></select>
            </label>
            <label>Contrat
              <select id="f-contract"><option value="">Tous</option></select>
            </label>
            <label>Compatibilité min.
              <select id="f-match">
                <option value="0">Toutes</option>
                <option value="40">≥ 40 %</option>
                <option value="60">≥ 60 %</option>
                <option value="80">≥ 80 %</option>
              </select>
            </label>
            <label>Candidature
              <select id="f-sent">
                <option value="">Toutes</option>
                <option value="open">Pas encore envoyée</option>
                <option value="sent">Déjà envoyée</option>
                <option value="withdrawn">Retirée — à renvoyer</option>
              </select>
            </label>
          </div>
          <details class="filter-more">
            <summary>Plus de filtres</summary>
            <div class="offer-advanced">
              <label>Entreprise
                <select id="f-company"><option value="">Toutes</option></select>
              </label>
              <label>Compétence
                <select id="f-skill"><option value="">Toutes</option></select>
              </label>
              <label>Mode
                <select id="f-mode">
                  <option value="">Tous</option>
                  <option value="remote">Remote</option>
                  <option value="hybrid">Hybride</option>
                  <option value="onsite">Présentiel</option>
                </select>
              </label>
              <label>Réponse de l’entreprise
                <select id="f-pace">
                  <option value="">Toutes</option>
                  <option value="answers">Répond aux candidatures</option>
                  <option value="fast">Répond vite (3 j ou moins)</option>
                </select>
              </label>
            </div>
          </details>
        </div>

        <section class="panel split-board">
          <div class="split-list">
            <div class="offer-list" id="offer-list"></div>
          </div>
          <article class="split-detail" id="offer-detail">
            <p class="muted">Choisissez une offre pour lire le poste.</p>
          </article>
        </section>
      
      </main>
    </div>
  </div>
  <div class="rc-scrim" id="rc-scrim"></div>
  <script defer src="../js/mascotte.js?v=20261105i"></script>

  <script defer src="../js/offer-card.js?v=20261105o"></script>
  <script defer src="../js/apply-wizard.js?v=20261106g"></script>
  <script defer src="../js/apply-profile-gate.js?v=20261106f"></script>
  <script defer src="../js/suggest.js?v=20261103g"></script>

  <script defer src="../js/candidate-home.js?v=20261109c"></script>
</body>
</html>
