<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Offres — HireLink</title>
  <meta http-equiv="refresh" content="0;url=candidate.html" />
  <script>location.replace("candidate.html" + location.search);</script>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css?v=20261026d" />
  <link rel="stylesheet" href="../css/design-system.css?v=20261026d" />
  <link rel="stylesheet" href="../css/app.css?v=20261026d" />
  <link rel="stylesheet" href="../css/components.css?v=20261026e" />
  <script src="../js/theme.js?v=20261026d"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="row between">
        <a class="brand" href="candidate.html"><span class="brand-mark"></span><span class="brand-name">Hire<span style="color:#e2c98a">Link</span></span></a>
        <button type="button" class="mobile-toggle" id="close-side">✕</button>
      </div>
      <nav class="side-nav">
        <a class="side-link" href="candidate-dashboard.html">Tableau de bord</a>
        <a class="side-link is-active" href="candidate.html">Offres</a>
        <a class="side-link" href="candidate-applications.html">Mes candidatures</a>
      </nav>
      <div id="nav-user" class="nav-user"></div>
      <div class="side-footer">
        <div id="side-user">—</div>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-logout" style="margin-top:0.75rem;color:#fff;border-color:rgba(255,255,255,.2)">Déconnexion</button>
      </div>
    </aside>
    <div class="app-main">
      <header class="topbar">
        <button type="button" class="btn btn-ghost btn-sm" id="open-side" style="display:none">Menu</button>
        <div class="topbar-search">
          <span>⌕</span>
          <input type="search" id="search-offers" placeholder="Poste, compétence, ville…" />
        </div>
        <div class="topbar-actions">
          <button type="button" class="btn btn-brass btn-sm" id="btn-premium">Premium</button>
          <div class="avatar" id="avatar">C</div>
        </div>
      </header>
      <main class="content">
        <div class="page-title">
          <div>
            <p class="eyebrow">Personnalisé</p>
            <h1>Offres pour vous</h1>
            <p class="muted">Classées selon votre profil, vos compétences et ce que vous recherchez.</p>
          </div>
          <a class="btn btn-soft" href="candidate-profile.html">Ajuster mon profil</a>
        </div>
        <section class="panel">
          <div class="panel-head"><h2>Alertes du jour</h2><span class="ai-chip">Matching</span></div>
          <div class="panel-body"><div class="alert-panel" id="match-alerts"></div></div>
        </section>
        <section class="panel">
          <div class="panel-head">
            <h2>Recommandations</h2>
            <span class="badge badge-rose" id="offers-count">0</span>
          </div>
          <div class="panel-body"><div class="offer-list" id="offer-list"></div></div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/ui.js?v=20261026d"></script>
  <script src="../js/api.js?v=20261026d"></script>
  <script src="../js/in-app-help.js?v=20261026d"></script>
  <script src="../js/product.js?v=20261026d"></script>
  <script src="../js/shell.js?v=20261026e"></script>
  <script src="../js/growth.js?v=20261026d"></script>
  <script src="../js/skills-catalog.js?v=20261026d"></script>
  <script src="../js/apply-wizard.js?v=20261026d"></script>
  <script src="../js/candidate-offers.js?v=20261026d"></script>
