<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mes offres — HireLink</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/tokens.css?v=20261026d" />
  <link rel="stylesheet" href="../css/design-system.css?v=20261026d" />
  <link rel="stylesheet" href="../css/app.css?v=20261026d" />
  <link rel="stylesheet" href="../css/components.css?v=20261027a" />
  <script src="../js/theme.js?v=20261026d"></script>
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="row between">
        <a class="brand" href="recruiter.html"><span class="brand-mark"></span><span class="brand-name">Hire<span style="color:#e2c98a">Link</span></span></a>
        <button type="button" class="mobile-toggle" id="close-side">✕</button>
      </div>
      <nav class="side-nav">
        <a class="side-link" href="recruiter.html">Tableau de bord</a>
        <a class="side-link" href="recruiter-pipeline.html">Pipeline</a>
        <a class="side-link is-active" href="recruiter-offers.html">Offres</a>
        <a class="side-link" href="recruiter-team.html">Entreprise</a>
        <a class="side-link" href="recruiter-settings.html">Paramètres</a>
      </nav>
      <div id="nav-user" class="nav-user"></div>
      <div class="side-footer">
        <div id="side-user">—</div>
        <button type="button" class="btn btn-ghost btn-sm" id="btn-logout" style="margin-top:0.75rem;color:#fff;border-color:rgba(255,255,255,.2)">Déconnexion</button>
      </div>
    </aside>
    <div class="app-main">
      <header class="topbar">
        <button type="button" class="btn btn-ghost btn-sm" id="open-side" style="display:none">Menu</button>
        <div class="topbar-search"><span aria-hidden="true">⌕</span><input type="search" id="search-offers-rec" placeholder="Titre, lieu, compétences…" autocomplete="off" /></div>
        <div class="topbar-actions">
          <button type="button" class="btn btn-brass btn-sm" id="btn-upgrade">Passer Premium</button>
          <div class="avatar" id="avatar">R</div>
        </div>
      </header>
      <main class="content">
        <div class="page-title">
          <div>
            <p class="eyebrow">Publication</p>
            <h1>Mes offres</h1>
            <p class="muted">Publiez uniquement si votre entreprise est vérifiée.</p>
          </div>
        </div>
        <div class="filter-board">
          <div class="filter-board-head">
            <strong>Publications</strong>
            <span class="muted" id="offers-rec-summary">Chargement…</span>
            <button type="button" class="btn btn-primary btn-sm" id="btn-new-offer">Nouvelle offre</button>
          </div>
          <div class="cand-filters" id="offer-status-filter" role="tablist" aria-label="Filtrer les offres">
            <button type="button" class="is-on" data-ov="all">Toutes</button>
            <button type="button" data-ov="published">Publiées</button>
            <button type="button" data-ov="draft">Brouillons</button>
            <button type="button" data-ov="with">Avec candidatures</button>
          </div>
        </div>
        <section class="panel">
          <div class="panel-body" style="padding:0 1.1rem 0.5rem;overflow-x:auto">
            <table class="table">
              <thead><tr><th>Titre</th><th>Délai réponse</th><th>Candidatures</th><th>Statut</th><th>Actions</th></tr></thead>
              <tbody id="offers-body"><tr><td colspan="5" class="muted">Chargement…</td></tr></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>
  </div>
  <script src="../js/ui.js?v=20261026d"></script>
  <script src="../js/api.js?v=20261026d"></script>
  <script src="../js/in-app-help.js?v=20261026d"></script>
  <script src="../js/product.js?v=20261026d"></script>
  <script src="../js/shell.js?v=20261027a"></script>
  <script src="../js/growth.js?v=20261026d"></script>
  <script src="../js/skills-catalog.js?v=20261026d"></script>
  <script src="../js/offer-wizard.js?v=20261026d"></script>
  <script src="../js/recruiter-offers.js?v=20261026d"></script>
</body>
</html>
