<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mot de passe — HireLink</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700&family=Fraunces:opsz,wght@9..144,700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/design-system.css" />
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>
  <div class="auth-panel" style="min-height:100vh">
    <div class="auth-card fade-up">
      <a class="brand" href="index.html" style="margin-bottom:1rem">
        <span class="brand-mark brand-mark--pulse"></span>
        <span class="brand-name">Hi<span class="r-pulse">r</span>e<span style="color:#e2c98a">Link</span></span>
      </a>
      <h2>Sécurisez votre compte</h2>
      <p class="muted">Optionnel maintenant — vous pouvez le faire plus tard.</p>
      <form class="auth-form" id="form">
        <div class="field">
          <label for="password">Mot de passe</label>
          <input id="password" type="password" minlength="6" required autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="password2">Confirmation</label>
          <input id="password2" type="password" minlength="6" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Enregistrer</button>
        <button type="button" class="btn btn-ghost btn-block" id="btn-skip">Plus tard</button>
        <button type="button" class="btn btn-soft btn-block" id="btn-back">Retour à mon espace</button>
      </form>
    </div>
  </div>
  <script src="js/config.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/api.js"></script>
  <script src="js/password-toggle.js"></script>
  <script>
    (function () {
      const s = HireLinkAPI.getSession();
      if (!s || !HireLinkAPI.getToken()) { location.href = "auth.html?mode=login"; return; }
      document.getElementById("form").addEventListener("submit", async (e) => {
        e.preventDefault();
        const p1 = document.getElementById("password").value;
        const p2 = document.getElementById("password2").value;
        if (p1 !== p2) { HireLink.toast("Erreur", "Confirmation différente", "warn"); return; }
        try {
          const auth = await HireLinkAPI.api("/auth/set-password", { method: "POST", body: { password: p1 } });
          HireLinkAPI.setAuth(auth);
          localStorage.removeItem("hirelink.pw.skip");
          HireLink.toast("OK", "Mot de passe enregistré", "ok");
          setTimeout(() => (location.href = HireLinkAPI.redirectForRole(auth.role)), 350);
        } catch (err) { HireLink.toast("Échec", err.message, "danger"); }
      });
      document.getElementById("btn-skip").addEventListener("click", () => {
        localStorage.setItem("hirelink.pw.skip", "1");
        location.href = HireLinkAPI.redirectForRole(s.role);
      });
      document.getElementById("btn-back").addEventListener("click", () => {
        location.href = HireLinkAPI.redirectForRole(s.role);
      });
    })();
  </script>
</body>
</html>
