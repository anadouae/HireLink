<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:8081 http://127.0.0.1:8081; connect-src 'self' http://localhost:8081 http://127.0.0.1:8081 https://accounts.google.com; frame-src https://accounts.google.com blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mot de passe — HireLink</title>
  <link rel="icon" type="image/png" href="assets/logo-hirelink-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css?v=20261029a" />
  <link rel="stylesheet" href="css/design-system.css?v=20261029a" />
  <link rel="stylesheet" href="css/components.css?v=20261029a" />
  <link rel="stylesheet" href="css/auth.css?v=20261029a" />
  <link rel="stylesheet" href="css/motion.css?v=20261029a" />
</head>
<body>
  <div class="auth-panel" style="min-height:100vh">
    <div class="auth-card fade-up">
      <a class="brand" href="index.html" style="margin-bottom:1rem">
        <span class="brand-mark brand-mark--pulse"></span>
        <span class="brand-name">Hi<span class="r-pulse">r</span>e<span style="color:#e2c98a">Link</span></span>
      </a>
      <h2>Sécurisez votre compte</h2>
      <p class="muted">Optionnel maintenant — vous pouvez le faire plus tard.</p>
      <form class="auth-form" id="form">
        <div class="field">
          <label for="password">Mot de passe</label>
          <input id="password" type="password" minlength="12" required autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="password2">Confirmation</label>
          <input id="password2" type="password" minlength="12" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Enregistrer</button>
        <button type="button" class="btn btn-ghost btn-block" id="btn-skip">Plus tard</button>
        <button type="button" class="btn btn-soft btn-block" id="btn-back">Retour à mon espace</button>
      </form>
    </div>
  </div>
  <script src="js/config.js?v=20261029a"></script>
  <script src="js/ui.js?v=20261029a"></script>
  <script src="js/api.js?v=20261029a"></script>
  <script src="js/password-toggle.js?v=20261029a"></script>
  <script src="js/set-password.js?v=20261029a"></script>
</body>
</html>
