<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <script src="js/public-theme.js?v=20261101r"></script>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https: http://localhost:8081 http://127.0.0.1:8081; connect-src 'self' http://localhost:8081 http://127.0.0.1:8081 https://accounts.google.com; frame-src https://accounts.google.com blob:; object-src 'none'; base-uri 'self'; form-action 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Paiement — HireLink</title>
  <link rel="icon" type="image/png" href="assets/logo-hirelink-icon.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/tokens.css?v=20261103a" />
  <link rel="stylesheet" href="css/checkout.css?v=20261103a" />
  <link rel="stylesheet" href="css/public-dark.css?v=20261107b" />
  <link rel="stylesheet" href="css/premium.css?v=20261107b" />
  <link rel="stylesheet" href="css/mascotte.css?v=20261105i" />
</head>
<body>
  <header class="pay-top">
    <a id="pay-back" href="index.html">← Retour</a>
    <strong>HireLink</strong>
    <span>Paiement simulé</span>
  </header>

  <main class="pay-wrap">
    <section class="pay-summary" aria-label="Récapitulatif">
      <p class="pay-kicker">Abonnement</p>
      <h1 id="pay-plan">Premium</h1>
      <p class="pay-sub" id="pay-sub">—</p>
      <div class="pay-cycle" role="group" aria-label="Période">
        <button type="button" class="is-on" aria-pressed="true" data-cycle="month">Mensuel</button>
        <button type="button" data-cycle="year">Annuel · 2 mois offerts</button>
      </div>
      <ul class="pay-lines" id="pay-lines"></ul>
      <dl class="pay-totals">
        <div><dt>Sous-total HT</dt><dd id="pay-ht">—</dd></div>
        <div><dt id="pay-tva-label">TVA</dt><dd id="pay-tva">—</dd></div>
        <div class="is-total"><dt>Total TTC</dt><dd id="pay-ttc">—</dd></div>
      </dl>
      <p class="pay-sim">Simulation. Aucune carte n’est débitée.</p>
    </section>

    <section class="pay-form-card" id="pay-panel">
      <div data-mascotte data-mascotte-pose="succes" data-mascotte-couronne="1"></div>
      <h2>Paiement simulé</h2>
      <p class="pay-sim">Mode démonstration — Aucun débit réel</p>
      <form id="pay-form" novalidate>
        <label>Scénario
          <select id="pay-scenario">
            <option value="SUCCESS">Paiement réussi</option>
            <option value="FAILURE">Paiement refusé</option>
          </select>
        </label>
        <p class="pay-error" id="pay-error" hidden></p>
        <p id="pay-status" class="pay-hint" hidden></p>
        <button type="submit" class="pay-submit" id="pay-submit">Confirmer le paiement simulé</button>
      </form>
    </section>

    <section class="pay-receipt" id="pay-receipt" hidden>
      <p class="pay-kicker">Paiement accepté</p>
      <h2>Reçu</h2>
      <dl id="pay-receipt-body"></dl>
      <div class="pay-receipt-actions">
        <button type="button" class="pay-secondary" id="pay-pdf">Voir la facture</button>
        <a class="pay-submit" id="pay-done" href="index.html">Continuer</a>
      </div>
    </section>
  </main>
  <script src="js/api.js?v=20261109a"></script>
  <script src="js/mascotte.js?v=20261105i"></script>
  <script src="js/checkout.js?v=20261106a"></script>
<script defer src="js/premium.js?v=20261106g"></script>
</body>
</html>
